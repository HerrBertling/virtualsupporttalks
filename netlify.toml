[build]
command = "npm run build"
publish = "build/client"

[dev]
command = "npm run dev"
framework = "vite"

# www.redezeitfuerdich.de is a second address for the same site. Until now it
# served a full copy of every page, so Google indexed the site twice and split
# its ranking. Send it to the primary domain, path and language intact:
#   redezeitfuerdich.de/de/ich-suche-redezeit
#   -> www.virtualsupporttalks.de/de/ich-suche-redezeit
#
# robots.txt, sitemap.xml and llms.txt stay on this domain on purpose. Google
# only transfers the ranking of the old URLs if it keeps crawling them and sees
# the 301s, and it needs that domain's own sitemap to find them. Netlify takes
# the first matching rule, so these three have to come first.

[[redirects]]
from = "https://www.redezeitfuerdich.de/robots.txt"
to = "/robots.txt"
status = 200
force = true

[[redirects]]
from = "https://www.redezeitfuerdich.de/sitemap.xml"
to = "/sitemap.xml"
status = 200
force = true

[[redirects]]
from = "https://www.redezeitfuerdich.de/llms.txt"
to = "/llms.txt"
status = 200
force = true

[[redirects]]
from = "https://www.redezeitfuerdich.de/*"
to = "https://www.virtualsupporttalks.de/:splat"
status = 301
force = true

[[redirects]]
from = "https://redezeitfuerdich.de/*"
to = "https://www.virtualsupporttalks.de/:splat"
status = 301
force = true

# Set immutable caching for static files, because they have fingerprinted filenames

[[headers]]
for = "/build/*"
[headers.values]
  "Cache-Control" = "public, max-age=31560000, immutable"

[[headers]]
for = "/fonts/*"
[headers.values]
  "Cache-Control" = "public, max-age=31560000, immutable"

[[headers]]
for = "/*"
[headers.values]
  "Cache-Control" = "public, max-age=0, must-revalidate"
  "Netlify-CDN-Cache-Control" = "public, s-maxage=3600, stale-while-revalidate=604800, durable"

# API endpoints must never be CDN-cached. The global /* rule would otherwise
# let stale 301s or other pre-deploy responses pin here for the SWR window.
[[headers]]
for = "/api/*"
[headers.values]
  "Cache-Control" = "private, no-store"
  "Netlify-CDN-Cache-Control" = "private, no-store"

# Password-gated admin routes return coach PII on POST. POST is uncacheable
# per HTTP spec, but pin it explicitly so the form GET and any future loader
# response can't land in the durable CDN either.
[[headers]]
for = "/*/admin/*"
[headers.values]
  "Cache-Control" = "private, no-store"
  "Netlify-CDN-Cache-Control" = "private, no-store"

# Sets the gdprConsent cookie on POST. Never cache.
[[headers]]
for = "/enable-analytics"
[headers.values]
  "Cache-Control" = "private, no-store"
  "Netlify-CDN-Cache-Control" = "private, no-store"